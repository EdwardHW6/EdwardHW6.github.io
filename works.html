<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小鱼的作品</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #0f2027, #203a43 55%, #2c5364);
    min-height: 100vh; color: #fff; padding: 32px 20px 40px;
  }
  h1 { font-size: 26px; text-align: center; letter-spacing: 2px; }
  .sub { text-align: center; opacity: .75; font-size: 13px; margin: 10px 0 28px; }
  .card {
    display: block; text-decoration: none; color: #fff;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);
    border-radius: 16px; padding: 22px; margin: 0 auto 16px; max-width: 520px;
  }
  .card .emoji { font-size: 34px; }
  .card h2 { font-size: 19px; margin: 10px 0 6px; }
  .card p { font-size: 14px; line-height: 1.7; opacity: .85; }
  .card .go { display: inline-block; margin-top: 12px; font-size: 14px; color: #ffd97a; }
  .tip { max-width: 520px; margin: 24px auto 0; font-size: 13px; line-height: 1.8; opacity: .7; text-align: center; }
</style>
</head>
<body>
  <h1>🐟 小鱼的作品</h1>
  <p class="sub">点开就能玩，不用下载、不用注册</p>

  <a class="card" href="./">
    <div class="emoji">⚔️</div>
    <h2>青竹蜂云剑阵 · 七十二口</h2>
    <p>手势御剑：剑指游龙随行、张掌莲花剑盘、握拳球形剑盾、摇滚手势大庚剑阵。新版加了破空剑啸声和火花特效，记得开声音。</p>
    <span class="go">打开玩 →</span>
  </a>

  <a class="card" href="./christmas-tree.html">
    <div class="emoji">🎄</div>
    <h2>圣诞树 · 手势版</h2>
    <p>张掌炸开成星云、握拳聚回圣诞树、捏合抓照片，还能上传自己的照片挂上树。</p>
    <span class="go">打开玩 →</span>
  </a>

  <a class="card" href="./hands/">
    <div class="emoji">🎈</div>
    <h2>手势游戏合集</h2>
    <p>对着摄像头捏爆气球的小游戏，外加一个手势实验室：20 种手势、挥手、画圈、双手缩放都能现场试。</p>
    <span class="go">打开玩 →</span>
  </a>

  <p class="tip">打开后点「开启手势」，允许使用摄像头即可。<br>微信里打不开摄像头时，点右上角「用 Safari 打开」。</p>
</body>
</html>
