<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>amap key test</title>
<script>window._AMapSecurityConfig = {securityJsCode: '6ecea36dd2a0ac15b36681ae0e2118c9'};</script>
<script src="https://webapi.amap.com/maps?v=2.0&key=1dbbafeed39ca89df5009e4b945fd685"></script>
<style>#map{width:800px;height:500px}body{font-family:sans-serif}</style></head>
<body><div id="status">LOADING</div><div id="map"></div>
<script>
window.onerror = function(m){ document.getElementById('status').textContent = 'ERROR: ' + m; };
try {
  var map = new AMap.Map('map', {center: [115.769671, 33.809745], zoom: 16});
  var marker = new AMap.Marker({position: [115.769671, 33.809745]});
  map.add(marker);
  map.on('complete', function(){ document.getElementById('status').textContent = 'MAP_COMPLETE'; });
  setTimeout(function(){
    var s = document.getElementById('status');
    if (s.textContent === 'LOADING') {
      var c = document.querySelector('#map canvas');
      s.textContent = c ? 'MAP_CANVAS_OK' : 'NO_CANVAS';
    }
  }, 8000);
} catch(e) { document.getElementById('status').textContent = 'EXCEPTION: ' + e.message; }
</script></body></html>
