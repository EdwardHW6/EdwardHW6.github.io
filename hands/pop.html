<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>气球爆破 · 手势游戏</title>
    <meta name="description" content="用摄像头手势控制的小游戏。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%88%3C/text%3E%3C/svg%3E" />
    <script type="module" crossorigin src="./assets/pop-BRMBXXGu.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/kit-CW37YRRp.js">
    <link rel="modulepreload" crossorigin href="./assets/draw-C1LGWSmp.js">
    <link rel="stylesheet" crossorigin href="./assets/pop-CL07jxEN.css">
  </head>
  <body>
    <canvas id="game"></canvas>
    <video id="cam" playsinline muted></video>
    <div class="hud">
      <span id="score">0</span>
      <span id="time">45</span>
      <span id="best">最高 0</span>
    </div>
    <div class="hints">🤏 捏合点击：戳破 · ✌️ 双击：范围爆破 · ☝️ 指点：激光 · 👋 滑动：吹风 · 👏 拍手：全屏戳破 · 👍 点赞：开始</div>
    <div id="overlay" class="overlay">
      <h1>🎈 气球爆破</h1>
      <p id="msg">45 秒内只用双手，尽可能多戳破气球。</p>
      <div class="row">
        <button id="b-cam">开启摄像头</button>
        <button id="b-mouse" class="ghost">用鼠标玩</button>
      </div>
      <p id="err" class="err"></p>
      <p class="small"><a href="./index.html">演示</a> · <a href="./lab.html">手势实验室</a></p>
    </div>
  </body>
</html>
