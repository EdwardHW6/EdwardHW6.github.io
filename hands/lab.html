<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>手势实验室</title>
    <meta name="description" content="试玩、测试和调校摄像头手势识别。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AA%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="./assets/lab-Bw5UnKnq.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/kit-CW37YRRp.js">
    <link rel="stylesheet" crossorigin href="./assets/lab-Di3x9dOj.css">
  </head>
  <body>
    <header class="top">
      <div class="brand"><span class="logo">🧪</span><b>手势实验室</b><span class="sub">手势引擎工作台</span></div>
      <nav class="tabs">
        <button data-tab="live" class="on">实时</button>
        <button data-tab="test">测试</button>
        <button data-tab="results">结果</button>
        <button data-tab="tune">调校</button>
        <a class="sbl" href="./index.html">👋 演示</a>
        <a class="sbl" href="./pop.html">🎈 气球游戏</a>
      </nav>
      <div class="status"><span id="st-dot" class="dot"></span><span id="st-text">摄像头未开启</span></div>
    </header>
    <main>
      <section class="stage">
        <div class="cam">
          <video id="cam" playsinline muted autoplay></video>
          <canvas id="overlay"></canvas>
          <div id="flash" class="flash"></div>
          <div id="prompt" class="prompt hidden"></div>
          <div id="start" class="start">
            <div class="big">🖐️</div>
            <h1>手势实验室</h1>
            <p>从你的摄像头实时识别引擎认识的每个手势。视频只留在你的设备上，不上传。</p>
            <button id="b-start" class="primary">开启摄像头</button>
            <p id="start-err" class="err"></p>
          </div>
        </div>
        <div class="readout" id="readout"></div>
      </section>
      <aside class="panel">
        <div id="tab-live" class="tab on"></div>
        <div id="tab-test" class="tab"></div>
        <div id="tab-results" class="tab"></div>
        <div id="tab-tune" class="tab"></div>
      </aside>
    </main>
  </body>
</html>
