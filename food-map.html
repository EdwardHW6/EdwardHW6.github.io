  DATA.filter(function(r){ return cat==='全部' || r.cat===cat; }).forEach(function(r, i){
    var c = COLORS[r.cat] || '#888';
    var div = document.createElement('div'); div.className = 'card'; div.style.borderLeftColor = c;
    div.innerHTML = '<div class="nm">' + r.name + '</div><div class="meta"><span class="rate">★ ' + r.rating.toFixed(1) + '</span>' +
      '<span class="tag" style="background:' + c + '">' + r.cat + '</span>' +
      (r.cost ? '<span>人均 ¥' + r.cost + '</span>' : '') + '<span>' + distText(r.distance) + '</span></div>';
    div.onclick = function(){
      var mk = markers.filter(function(m){ return m._r === r; })[0];
      map.setZoomAndCenter(14.5, [r.lng, r.lat]); openInfo(r, mk);
    };
    listEl.appendChild(div);
  });
  if (!listEl.children.length) listEl.innerHTML = '<div style="padding:14px;color:#8a7a63;font-size:13px;">这一类暂时没有 4.5 分以上的。</div>';
}
cats.forEach(function(c, i){
  var b = document.createElement('button'); b.className = 'chip' + (i===0 ? ' on' : ''); b.textContent = c;
  b.onclick = function(){ document.querySelectorAll('.chip').forEach(function(x){ x.classList.remove('on'); }); b.classList.add('on'); render(c); };
  chipsEl.appendChild(b);
});
render('全部');
</script>
</body>
</html>
