<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>tmap key test</title>
<script src="https://map.qq.com/api/gljs?v=1.exp&key=THYBZ-QZ5L4-FTBUZ-KGSAY-OWM76-2VF7V"></script>
<style>#map{width:800px;height:500px}body{font-family:sans-serif}</style></head>
<body><div id="status">LOADING</div><div id="map"></div>
<script>
window.onerror = function(m){ document.getElementById('status').textContent = 'ERROR: ' + m; };
try {
  var center = new TMap.LatLng(33.809745, 115.769671);
  var map = new TMap.Map(document.getElementById('map'), {center: center, zoom: 16});
  var marker = new TMap.MultiMarker({map: map, geometries: [{id: '1', position: center}]});
  setTimeout(function(){
    var c = document.querySelector('#map canvas');
    document.getElementById('status').textContent = c ? 'MAP_CANVAS_OK' : 'NO_CANVAS';
  }, 5000);
} catch(e) { document.getElementById('status').textContent = 'EXCEPTION: ' + e.message; }
</script></body></html>
